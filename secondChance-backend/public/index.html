<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SecondChance</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(135deg, #e8f5e9, #c8e6c9);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: #1b5e20;
    }
    h1 { font-size: 3rem; margin-bottom: 0.5rem; }
    p { font-size: 1.25rem; max-width: 560px; margin: 0 auto 2rem; color: #2e7d32; }
    a.button {
      display: inline-block;
      padding: 14px 36px;
      background: #2e7d32;
      color: #fff;
      text-decoration: none;
      border-radius: 8px;
      font-size: 1.1rem;
    }
    a.button:hover { background: #1b5e20; }
    #deploy-url { position: fixed; top: 0; left: 0; right: 0; background: #1b3a1b; color: #c8e6c9; font-family: monospace; font-size: .9rem; padding: 6px 28px; text-align: left; }
  </style>
</head>
<body>
  <main>
    <h1>SecondChance</h1>
    <p>Give your household items a second life. Share what you no longer need and find free items near you instead of buying new.</p>
    <a class="button" href="/app/main.html">Get Started</a>
  </main>
  <div id="deploy-url"></div>
  <script>document.getElementById('deploy-url').textContent = 'Deployment URL: ' + window.location.href</script>
</body>
</html>
